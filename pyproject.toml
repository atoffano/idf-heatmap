[project]
name = "sorbonne-transport-map"
version = "0.1.0"
description = "Interactive multimodal travel-time heatmap from Sorbonne Université Campus Pierre et Marie Curie (7-9 quai Saint Bernard, 75005 Paris)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contourpy>=1.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "networkx>=3.3",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "pyproj>=3.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "scipy>=1.14.0",
    "shapely>=2.0.0",
    "uvicorn>=0.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]


